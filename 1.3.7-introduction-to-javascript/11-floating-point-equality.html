<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equality comparison: floating point</title>
    <script>
        let number1 = 0.3
        let number2 = 0.1 + 0.2
        console.log(number1 == number2)

        // Slide 27
        console.log(0.3);
        // 0.3

        console.log(0.1+0.2);
        // 0.30000000000000004
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
