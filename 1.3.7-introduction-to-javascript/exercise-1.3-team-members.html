<!--
Coding Exercise 1.3 (slide 29)
Scenario - You are building a simple application to manage team member information
(there are 5 members in your team).

Each team member should have the following properties:
  First name: The team member's first name.
  Last name: The team member's last name.
  Hobbies (array): An array of the team member's hobbies.
  Favourite food (array): An array of the team member's favorite foods.
  Pets (array): An array of the team member's pets.
(Open the browser console to see each member printed as an object, as in the slide example.)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Exercise 1.3</title>
    <script>
        // One object per team member (replace the sample data with your own team)
        const member1 = {
            firstName: "Sarah",
            lastName: "Johnson",
            hobbies: ["reading", "hiking", "photography"],
            favouriteFood: ["pizza", "sushi", "chocolate"],
            pets: ["dog", "cat"]
        };

        const member2 = {
            firstName: "Daniel",
            lastName: "Lim",
            hobbies: ["football", "gaming"],
            favouriteFood: ["nasi lemak", "satay"],
            pets: ["fish"]
        };

        const member3 = {
            firstName: "Aisyah",
            lastName: "Rahman",
            hobbies: ["painting", "cycling", "baking"],
            favouriteFood: ["laksa", "cheesecake"],
            pets: ["cat", "rabbit"]
        };

        const member4 = {
            firstName: "Kumar",
            lastName: "Raj",
            hobbies: ["badminton", "cooking"],
            favouriteFood: ["roti canai", "biryani", "ice cream"],
            pets: ["dog"]
        };

        const member5 = {
            firstName: "Mei Ling",
            lastName: "Tan",
            hobbies: ["music", "travelling", "yoga"],
            favouriteFood: ["dim sum", "mango"],
            pets: ["hamster", "turtle"]
        };

        // Array that stores the 5 members
        const team = [member1, member2, member3, member4, member5];

        console.log(member1);
        console.log(member2);
        console.log(member3);
        console.log(member4);
        console.log(member5);
        console.log(team.length);
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the team members</h1>
</body>
</html>
