<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable naming rules</title>
    <script>
        // Recommended: lower camel case
        let mathScore;
        let physicScore;
        // Not recommended (slide 12)
        let englishscore = 76;      // Hard to read
        let ChemistryScore = 57;    // First letter should start with lowercase

        // Or separate the words by an underscore letter
        let biology_score;
        // let history-score;       // Variable names cannot be separated by a dash (syntax error, so commented out)

        // Use meaningful names (slide 13)
        // let score1;
        // let score2;

        // The usage of JavaScript keywords is strictly not allowed (slide 14).
        // These lines are syntax errors, so they are commented out so the file can still run:
        // let function = "addition";
        // let new = 1;
        // let case = 3;
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
