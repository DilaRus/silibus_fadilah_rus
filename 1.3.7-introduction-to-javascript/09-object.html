<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
    <script>
        let student = {
            firstName: "Susan",
            lastName: "Lee",
            age: 19
        };

        console.log(student.firstName);
        console.log(student["lastName"]);

        student.age = 20;
        console.log(student.age);
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
