<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constant object</title>
    <script>
        const person = {
            name: "Alice",
            age: 30
        };

        person.age = 31;
        person.city = "New York";
        console.log(person); // { name: "Alice", age: 31, city: "New York" }
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
