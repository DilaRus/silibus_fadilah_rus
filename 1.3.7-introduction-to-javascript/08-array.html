<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array</title>
    <script>
        let numArr = [3, 6, 7, 9, 10];
        let fruitArr = ["Apple", "Orange", "Grape"];

        console.log(numArr.length);
        console.log(fruitArr.length);

        console.log(numArr);
        console.log(numArr[3]);

        fruitArr[1] = "Durian";
        console.log(fruitArr[1]);
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
