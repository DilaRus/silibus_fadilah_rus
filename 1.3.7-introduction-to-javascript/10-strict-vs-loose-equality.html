<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>=== vs ==</title>
    <script>
        let number1 = 3;
        let number2 = "3";
        console.log(number1 === number2);
        console.log(number1 == number2);
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
