<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Me</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 300px;
      }
      /* Slide 15 (notes) continues with the img, h1, p and .tag rules below,
         which give the circular photo and the tag style shown in the output. */
      img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
      }
      h1 {
        color: #333;
        font-size: 24px;
      }
      p {
        color: #666;
      }
      .tag {
        display: inline-block;
        background: #e1ecf4;
        color: #39739d;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2mrs3MrWoVLumaVGtRqcWom1rrb-EuzEL8xAdWXctU5qunhUaW4E22BsL&s=10"
        alt="Profile Picture"
        width="200"
        height="300"
      />

      <h1>You are stalking me</h1>
      <p>I am cute and I know it.</p>
<p>This is me using INTERNAL css</p>

      <hr />

      <div>
        <span class="tag">Black</span>
        <span class="tag">White</span>
        <span class="tag">Cute</span>
      </div>

      
    </div>
  </body>
</html>
