<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional: pure vs impure</title>
    <script>
        const xs = [1,2,3,4,5];

        // pure
        xs.slice(0,3); // [1,2,3]
        xs.slice(0,3); // [1,2,3]
        xs.slice(0,3); // [1,2,3]


        // impure
        xs.splice(0,3); // [1,2,3]
        xs.splice(0,3); // [4,5]
        xs.splice(0,3); // []
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
