<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional: currying</title>
    <script>
        // your normal function
        const add = (a, b) => {
          return a + b;
        }

        console.log(add(1,2));

        // using currying
        const addCurried = (a) => {
          return (b) => {
            return a + b;
          }
        }

        console.log(addCurried(1)(2));
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
