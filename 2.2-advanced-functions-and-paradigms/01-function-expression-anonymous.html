<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function expression (anonymous)</title>
    <script>
        let addition= function (num1, num2){
            return num1 + num2;
        };

        console.log("The addition result is " + addition(8, 9));
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
