<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOP: class constructor</title>
    <script>
        class Member{
          // The constructor method is special. It runs when a new object is created.
          // It's used to initialize the object's properties.
          constructor(firstName, lastName){
            // Private attribute
            this._firstName = firstName;
            this._lastName = lastName;
          }
        }
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
