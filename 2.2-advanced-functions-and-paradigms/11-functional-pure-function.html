<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional: pure function</title>
    <script>
        // Pure function
        function fullName(firstName, lastName){
          return `${firstName} ${lastName}`
        }

        console.log(fullName("Johnny", "Bravo"));
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
