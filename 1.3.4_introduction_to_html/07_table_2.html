<!-- Slide 20 shows these as two snippets. They are placed in one page so both can be seen.
     FIX: the slide uses curly quotes (border=“0") which browsers do not accept as an attribute value.
     Straight quotes are used here, as taught in the attributes lesson (name="value"). -->
<html>
<body>

<p>Table with border</p>
<table border="1">
<tr>
<td>Row 1, cell 1</td>
 <td>Row 1, cell 2</td>
 </tr>
 </table>

<p>Table without border</p>
<table border="0">
<tr>
<td>Row 1, cell 1</td>
 <td>Row 1, cell 2</td>
 </tr>
 </table>

</body>
</html>
