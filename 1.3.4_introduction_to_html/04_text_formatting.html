<html>
<head>
    <title>Text Formatting</title>
</head>
<body>
    <b>This text is bold.</b><br><br>
    <big>This text is bigger.</big><br><br>
    <em>This text is emphasized.</em><br><br>
    <i>This text is italic.</i><br><br>
    <small>This text is smaller.</small><br><br>
    <strong>This text is strong.</strong><br><br>
    This text has a <sub>subscript</sub>.<br><br>
    This text has a <sup>superscript</sup>.<br><br>
</body>
</html>
