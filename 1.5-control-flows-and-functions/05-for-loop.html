<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for loop</title>
    <script>
        let myArray = [4, 5, 6, 10, 12];
        let total = 0;

        for (let i = 0; i < myArray.length; i++){
            total += myArray[i];
        }

        console.log(total);
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
