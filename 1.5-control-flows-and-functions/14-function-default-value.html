<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function with default value</title>
    <script>
        function say(name, age = 0) {
            console.log(`My name is ${name}. I'm ${age} this year`)
        }
        say("GAIA")
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
