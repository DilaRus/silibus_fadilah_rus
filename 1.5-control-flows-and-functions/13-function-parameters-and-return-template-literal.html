<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function with return and template literal</title>
    <script>
        function say(name, age) {
            return (`My name is ${name}. This year I'm turning ${age}.`)
        }
        console.log(say("GAIA", 1))
    </script>
</head>
<body>
    <h1>Open the browser console (F12) to see the output</h1>
</body>
</html>
