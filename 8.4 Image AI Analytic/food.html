<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Pinky your food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff0f6;
    --bg2: #ffd9e8;
    --card: #ffffff;
    --pink: #ff7eb3;
    --pink-dark: #f25c9a;
    --pink-soft: #ffc2da;
    --text: #5a2a42;
    --muted: #b07a95;
    --border: #ffd0e2;
    --error: #d6336c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Fredoka", "Quicksand", "Nunito", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 20%, #fff 0 2px, transparent 3px) 0 0 / 46px 46px,
      linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex;
    justify-content: center;
    padding: 24px 16px 220px;
    overflow-x: hidden;
  }
  main {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative;
    z-index: 2;
  }

  /* ---------- header ---------- */
  header { text-align: center; position: relative; }
  .pinky { width: 92px; height: 92px; animation: bob 3s ease-in-out infinite; }
  h1 { font-size: 2rem; margin: 6px 0 4px; color: var(--pink-dark); font-weight: 600; }
  .sub { margin: 0 auto; max-width: 460px; color: var(--muted); font-size: 0.98rem; line-height: 1.45; }

  .sound-toggle {
    position: absolute; top: 0; right: 0;
    padding: 8px 14px;
    font-size: 0.85rem;
    background: #fff;
    color: var(--pink-dark);
    border: 2px solid var(--border);
    border-radius: 999px;
  }
  .sound-toggle:hover { background: #fff6fa; }

  /* ---------- upload ---------- */
  form {
    display: flex; flex-direction: column; gap: 14px; align-items: center;
    background: #fff;
    padding: 16px;
    border-radius: 32px;
    border: 3px solid var(--pink-soft);
    box-shadow: 0 8px 24px rgba(255, 126, 179, 0.2);
  }
  .drop {
    width: 100%;
    min-height: 190px;
    border: 3px dashed var(--pink-soft);
    border-radius: 24px;
    background: #fff8fb;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    overflow: hidden;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .drop:hover, .drop.over { background: #ffeef5; border-color: var(--pink); transform: scale(1.01); }
  .drop .big { font-size: 2.6rem; display: block; margin-bottom: 6px; }
  .drop small { color: #d7a6bd; }
  #preview { width: 100%; max-height: 300px; object-fit: contain; display: block; }
  .hint { margin: 0; min-height: 1.2em; font-size: 0.88rem; color: var(--error); }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  #send {
    padding: 12px 34px;
    font-size: 1.05rem; font-weight: 500;
    color: #fff;
    background: linear-gradient(180deg, #ff9cc6, var(--pink-dark));
    border-radius: 999px;
    box-shadow: 0 5px 0 #d94887, 0 8px 16px rgba(242, 92, 154, 0.35);
  }
  #send:hover { transform: translateY(-2px) scale(1.04); }
  #send:active, #send.boing { transform: translateY(4px); box-shadow: 0 1px 0 #d94887; }
  #send:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  /* ---------- results ---------- */
  #chat { display: flex; flex-direction: column; gap: 14px; }
  .item { display: flex; flex-direction: column; gap: 8px; animation: pop-in 0.35s ease; }
  .photo {
    align-self: flex-end;
    max-width: 60%;
    padding: 6px;
    background: var(--pink);
    border-radius: 22px 22px 6px 22px;
  }
  .photo img { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 16px; }
  .a-wrap {
    align-self: flex-start;
    max-width: 94%;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 22px 22px 22px 6px;
    padding: 12px 16px;
    box-shadow: 0 4px 14px rgba(255, 126, 179, 0.12);
  }
  .who { margin: 0 0 4px; font-size: 0.78rem; color: var(--pink-dark); font-weight: 600; }
  .a { margin: 0; white-space: pre-wrap; line-height: 1.55; }
  .a strong { color: var(--pink-dark); font-weight: 600; }
  .loading { color: var(--muted); font-style: italic; }
  .error { color: var(--error); }
  .empty { text-align: center; color: var(--muted); padding: 8px 0; margin: 0; }

  /* ---------- plants ---------- */
  .plant { position: fixed; bottom: 0; pointer-events: none; z-index: 1; }
  .plant-left { left: 0; width: min(210px, 34vw); }
  .plant-right { right: 0; width: min(190px, 32vw); }
  .sway { transform-origin: 50% 100%; animation: sway 4.5s ease-in-out infinite; }
  .sway.slow { animation-duration: 6s; animation-delay: -2s; }

  .petal {
    position: fixed; top: -40px; pointer-events: none; z-index: 1;
    font-size: 1.3rem; opacity: 0.8;
    animation: fall linear infinite;
  }

  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes sway { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes pop-in { from { opacity: 0; transform: translateY(10px) scale(0.96); } to { opacity: 1; transform: none; } }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  .eye { transform-origin: center; transform-box: fill-box; animation: blink 4s infinite; }

  @media (prefers-reduced-motion: reduce) {
    .pinky, .sway, .petal, .eye, .item { animation: none; }
  }
  @media (max-width: 480px) {
    h1 { font-size: 1.6rem; }
    .sound-toggle { position: static; margin-bottom: 8px; }
  }
</style>
</head>
<body>

<!-- reusable flower shape: <use href="#flower"> draws it, "color" sets petal colour -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="flower" viewBox="0 0 100 100">
      <g fill="currentColor" stroke="rgba(255,255,255,0.7)" stroke-width="1.5">
        <circle cx="50" cy="28" r="17"/>
        <circle cx="70.9" cy="43.2" r="17"/>
        <circle cx="62.9" cy="67.8" r="17"/>
        <circle cx="37.1" cy="67.8" r="17"/>
        <circle cx="29.1" cy="43.2" r="17"/>
      </g>
      <circle cx="50" cy="50" r="11" fill="#ffd54f"/>
      <circle cx="47" cy="47" r="3" fill="#fff3b0"/>
    </symbol>
  </defs>
</svg>

<!-- falling petals -->
<span class="petal" style="left:8%;  animation-duration:14s; animation-delay:0s">🌸</span>
<span class="petal" style="left:27%; animation-duration:18s; animation-delay:-6s">🌸</span>
<span class="petal" style="left:48%; animation-duration:16s; animation-delay:-3s">🌷</span>
<span class="petal" style="left:66%; animation-duration:20s; animation-delay:-10s">🌸</span>
<span class="petal" style="left:84%; animation-duration:15s; animation-delay:-8s">🌼</span>

<main>
  <header>
    <button type="button" class="sound-toggle" id="sound-toggle">🔊 Sound on</button>

    <!-- Pinky -->
    <svg class="pinky" viewBox="0 0 100 100" aria-hidden="true">
      <ellipse cx="50" cy="90" rx="26" ry="5" fill="#f5b5cd" opacity="0.6"/>
      <path d="M50 14 C78 14 90 38 88 60 C86 80 70 88 50 88 C30 88 14 80 12 60 C10 38 22 14 50 14 Z" fill="#ff9fc6"/>
      <ellipse cx="34" cy="58" rx="8" ry="5" fill="#ff6f9f" opacity="0.55"/>
      <ellipse cx="66" cy="58" rx="8" ry="5" fill="#ff6f9f" opacity="0.55"/>
      <g class="eye"><ellipse cx="37" cy="48" rx="5" ry="6.5" fill="#4a1f35"/><circle cx="39" cy="45.5" r="2" fill="#fff"/></g>
      <g class="eye"><ellipse cx="63" cy="48" rx="5" ry="6.5" fill="#4a1f35"/><circle cx="65" cy="45.5" r="2" fill="#fff"/></g>
      <path d="M43 62 Q50 70 57 62" stroke="#4a1f35" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g color="#fff"><use href="#flower" x="60" y="-6" width="34" height="34"/></g>
    </svg>

    <h1>Show Pinky your food</h1>
    <p class="sub">Pinky will peek at your photo and guess the calories, the color and the weight 🍓</p>
  </header>

  <form id="food-form">
    <label class="drop" id="drop" for="file">
      <input type="file" id="file" accept="image/png,image/jpeg" hidden>
      <div id="drop-empty">
        <span class="big">📷</span>
        Tap to pick a food photo<br>
        <small>or drop it here · JPEG or PNG · up to 10MB</small>
      </div>
      <img id="preview" alt="Your food photo" hidden>
    </label>
    <p class="hint" id="hint"></p>
    <button type="submit" id="send" disabled>Analyze 🌸</button>
  </form>

  <section id="chat">
    <p class="empty" id="empty">Pinky is hungry for a photo 🌷</p>
  </section>
</main>

<!-- left plant -->
<svg class="plant plant-left" viewBox="0 0 160 220" aria-hidden="true">
  <g class="sway">
    <path d="M80 168 C80 130 68 100 58 72" stroke="#6fbf8b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M80 168 C84 122 96 90 106 58" stroke="#6fbf8b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M80 168 C80 140 80 100 80 44" stroke="#6fbf8b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="66" cy="130" rx="16" ry="7" fill="#8fd3a6" transform="rotate(-35 66 130)"/>
    <ellipse cx="96" cy="126" rx="16" ry="7" fill="#8fd3a6" transform="rotate(35 96 126)"/>
    <ellipse cx="72" cy="98" rx="13" ry="6" fill="#a6e0b8" transform="rotate(-30 72 98)"/>
    <ellipse cx="92" cy="92" rx="13" ry="6" fill="#a6e0b8" transform="rotate(30 92 92)"/>
    <g color="#ff9cc6"><use href="#flower" x="38" y="50" width="40" height="40"/></g>
    <g color="#ffb3d1"><use href="#flower" x="86" y="36" width="40" height="40"/></g>
    <g color="#ff7eb3"><use href="#flower" x="62" y="18" width="36" height="36"/></g>
  </g>
  <rect x="38" y="162" width="84" height="14" rx="7" fill="#f48fb1"/>
  <path d="M46 176 L114 176 L107 216 L53 216 Z" fill="#f9a8c6"/>
  <circle cx="80" cy="196" r="4" fill="#fff" opacity="0.7"/>
</svg>

<!-- right plant -->
<svg class="plant plant-right" viewBox="0 0 140 200" aria-hidden="true">
  <g class="sway slow">
    <path d="M70 150 C70 112 74 82 70 52" stroke="#6fbf8b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M70 150 C58 130 44 112 36 96" stroke="#6fbf8b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="86" cy="118" rx="15" ry="6.5" fill="#8fd3a6" transform="rotate(30 86 118)"/>
    <ellipse cx="54" cy="124" rx="15" ry="6.5" fill="#a6e0b8" transform="rotate(-30 54 124)"/>
    <ellipse cx="80" cy="88" rx="12" ry="5.5" fill="#a6e0b8" transform="rotate(35 80 88)"/>
    <g color="#ffffff"><use href="#flower" x="50" y="28" width="42" height="42"/></g>
    <g color="#ffc2da"><use href="#flower" x="16" y="74" width="32" height="32"/></g>
  </g>
  <rect x="36" y="146" width="68" height="13" rx="6.5" fill="#ff9fc6"/>
  <path d="M42 159 L98 159 L93 196 L47 196 Z" fill="#ffc2da"/>
  <circle cx="70" cy="178" r="4" fill="#fff" opacity="0.7"/>
</svg>

<script>
  const form = document.getElementById("food-form");
  const fileInput = document.getElementById("file");
  const drop = document.getElementById("drop");
  const dropEmpty = document.getElementById("drop-empty");
  const preview = document.getElementById("preview");
  const hint = document.getElementById("hint");
  const sendBtn = document.getElementById("send");
  const chat = document.getElementById("chat");
  const empty = document.getElementById("empty");
  const soundBtn = document.getElementById("sound-toggle");

  const ALLOWED = ["image/jpeg", "image/png"];
  const MAX_BYTES = 10000000;          // same 10MB limit as your Python code
  let selectedFile = null;

  /* ---------- sound (made in the browser, no audio files needed) ---------- */
  let soundOn = true;
  let audioCtx = null;

  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(fromHz, toHz, delay, length, type, volume) {
    const c = getCtx();
    const t = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(fromHz, t);
    osc.frequency.exponentialRampToValueAtTime(toHz, t + length);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume || 0.15, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + length);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t);
    osc.stop(t + length + 0.02);
  }
  function popSound() {
    if (!soundOn) return;
    try { tone(500, 900, 0, 0.12, "sine", 0.16); tone(900, 1300, 0.07, 0.1, "triangle", 0.08); } catch (e) {}
  }
  function chimeSound() {
    if (!soundOn) return;
    try { [784, 988, 1319].forEach((f, i) => tone(f, f, i * 0.09, 0.28, "sine", 0.1)); } catch (e) {}
  }
  function oopsSound() {
    if (!soundOn) return;
    try { tone(320, 170, 0, 0.3, "sine", 0.12); } catch (e) {}
  }

  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊 Sound on" : "🔇 Sound off";
    popSound();
  });

  /* ---------- picking a photo ---------- */
  function setFile(file) {
    hint.textContent = "";
    if (!file) return;

    if (!ALLOWED.includes(file.type)) {
      hint.textContent = "Pinky only eats JPEG and PNG photos 🌸";
      oopsSound();
      return;
    }
    if (file.size > MAX_BYTES) {
      hint.textContent = "That photo is too big for Pinky (max 10MB) 🌸";
      oopsSound();
      return;
    }

    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    dropEmpty.hidden = true;
    sendBtn.disabled = false;
    popSound();
  }

  fileInput.addEventListener("change", () => setFile(fileInput.files[0]));

  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    setFile(e.dataTransfer.files[0]);
  });

  /* ---------- turn Pinky's **bold** text into real bold, safely ---------- */
  function formatAnswer(text) {
    const safe = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    return safe
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/^\s*[*-]\s+/gm, "• ");
  }

  /* ---------- send the photo to Pinky ---------- */
  form.addEventListener("submit", async (event) => {
    event.preventDefault();               // stop the page from reloading
    if (!selectedFile) return;

    popSound();
    sendBtn.classList.add("boing");
    setTimeout(() => sendBtn.classList.remove("boing"), 160);

    const file = selectedFile;
    const thumbUrl = preview.src;

    // reset the picker so you can choose another photo
    selectedFile = null;
    fileInput.value = "";
    preview.hidden = true;
    dropEmpty.hidden = false;
    sendBtn.disabled = true;
    empty.style.display = "none";

    // photo bubble + Pinky's answer bubble
    const item = document.createElement("div");
    item.className = "item";

    const photo = document.createElement("div");
    photo.className = "photo";
    const img = document.createElement("img");
    img.src = thumbUrl;
    img.alt = "Your food photo";
    photo.append(img);

    const wrap = document.createElement("div");
    wrap.className = "a-wrap";
    const who = document.createElement("p");
    who.className = "who";
    who.textContent = "🌸 Pinky";
    const a = document.createElement("p");
    a.className = "a loading";
    a.textContent = "Pinky is looking at your food...";
    wrap.append(who, a);

    item.append(photo, wrap);
    chat.prepend(item);                   // newest on top

    try {
      // the name "file" must match the parameter name in your Python: file: UploadFile
      const body = new FormData();
      body.append("file", file);

      // calls your FastAPI route: POST /analyze-image
      const res = await fetch("/analyze-image", { method: "POST", body });
      const data = await res.json();      // {"analysis": ...} or {"detail": ...}
      if (!res.ok) throw new Error(data.detail || "server said " + res.status);

      a.className = "a";
      a.innerHTML = formatAnswer(data.analysis);
      chimeSound();
    } catch (err) {
      a.className = "a error";
      a.textContent = "Oops, Pinky tripped over a flower pot 🪴 (" + err.message + ")";
      oopsSound();
    }
  });
</script>
</body>
</html>
